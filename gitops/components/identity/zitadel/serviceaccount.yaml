# The zitadel chart renders its ServiceAccount as a Helm PreSync hook
# (`helm.sh/hook: pre-install,pre-upgrade` + `hook-delete-policy:
# before-hook-creation`), which keeps it OUT of the zitadel app's tracked
# resource tree. Around 2026-07-14 a PreSync deleted it and was interrupted
# before recreating it. The Deployment could then never create a pod
# (`ReplicaFailure/FailedCreate: serviceaccount "zitadel" not found`) while the
# app still reported Synced — so selfHeal never noticed and no sync ever re-ran
# the hook. Zitadel was down 38 days before anyone looked.
#
# Owning the ServiceAccount here makes it a TRACKED resource that selfHeal
# restores. The identity app is wave 4, so it exists before the chart's wave-5
# PreSync jobs run. Paired with `serviceAccount.create: false` +
# `serviceAccount.name: zitadel` in
# gitops/environments/sbx/identity/values/zitadel.yaml, so the chart's
# `zitadel.serviceAccountName` helper resolves to this SA for the Deployment,
# both Jobs, and the Role/RoleBinding the chart still owns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel
  namespace: zitadel
