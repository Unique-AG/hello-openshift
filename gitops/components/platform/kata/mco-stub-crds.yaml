# Stub machineconfiguration.openshift.io CRDs — this is a hosted-
# control-plane cluster (controlPlaneTopology: External): the guest
# has no Machine Config Operator and no MachineConfig/MachineConfigPool
# CRDs. The sandboxed-containers operator (1.12.x) unconditionally
# watches MachineConfigPool (SetupWithManager), so without the CRD the
# kataconfig controller cache never syncs and controller-manager
# crashloops ("no matches for kind MachineConfigPool ... failed to wait
# for kataconfig caches to sync", exits main.go:204).
#
# With these stubs (nothing reconciles them):
#   * machineconfigpools  -> the MCP informer syncs; the operator also
#     creates an inert `kata-oc` MCP object itself.
#   * machineconfigs      -> the default `MachineConfig` deploymentMode
#     probe (isMachineConfigAvailable) passes; the extension MC the
#     operator writes is inert.
#   * containerruntimeconfigs -> processLogLevel() gets NotFound
#     instead of NoMatch, so reconciles don't end in an error-requeue
#     loop.
#
# The peer-pods path (CAA daemonset, kata-remote RuntimeClass, webhook)
# does not depend on MCO convergence. Workers must carry the
# node-role.kubernetes.io/kata-oc label BEFORE KataConfig creation so
# updateNodeLabels() reports no change and the reconcile is not parked
# on "Waiting for MCO to start updating".
#
# MANUAL (cluster-admin) STEPS ON A FRESH CLUSTER — ROSA's managed
# webhook (regular-user-validation.managed.openshift.io) denies every
# serviceaccount (operator SA and ArgoCD alike) writing
# machineconfigs/machineconfigpools; only cluster-admins-group users
# are exempt, so these two objects cannot live in this kustomization:
#   1. oc label nodes -l node-role.kubernetes.io/worker \
#        node-role.kubernetes.io/kata-oc=
#   2. pre-create MachineConfig 50-enable-sandboxed-containers-extension
#      with the EXACT spec the operator logs (reflect.DeepEqual match,
#      ignition 3.2.0, extensions [sandboxed-containers], role kata-oc
#      label) — otherwise the operator tries a webhook-denied Update.
#   3. pre-create MachineConfigPool kata-oc (label
#      pools.operator.machineconfiguration.openshift.io/kata-oc: "",
#      machineConfigSelector role In [kata-oc, worker], nodeSelector
#      node-role.kubernetes.io/kata-oc: "") — Get-first, never updated.
#   4. the podvm AMI job needs secret peer-pods-image-creation-secret
#      (keys aws_access_key_id/aws_secret_access_key) created by hand:
#      CCO is Manual on HCP so the job's CredentialsRequest never mints
#      it. IAM policy: terraform/2-cluster peer_pods_image_creation.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineconfigs.machineconfiguration.openshift.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: machineconfiguration.openshift.io
  scope: Cluster
  names:
    kind: MachineConfig
    listKind: MachineConfigList
    plural: machineconfigs
    singular: machineconfig
    shortNames:
      - mc
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
