# Namespace for the External Secrets Operator controller.
# Name and the `external-secrets` ServiceAccount inside it must match
# the IRSA trust in terraform/2-cluster/oidc.tf:
#   system:serviceaccount:external-secrets:external-secrets
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
    unique.ag/environment: base
    unique.ag/layer: applications
