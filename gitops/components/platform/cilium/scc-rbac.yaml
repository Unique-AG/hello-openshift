# Cilium agent/operator require the privileged SCC
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-privileged-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: cilium
    namespace: cilium
  - kind: ServiceAccount
    name: cilium-operator
    namespace: cilium
  - kind: ServiceAccount
    name: cilium-envoy
    namespace: cilium
  - kind: ServiceAccount
    name: hubble-relay
    namespace: cilium
  - kind: ServiceAccount
    name: hubble-ui
    namespace: cilium
