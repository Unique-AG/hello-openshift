# Harbor's own admin password and internal secretKey, from AWS Secrets Manager.
#
# The chart otherwise ships harborAdminPassword: "Harbor12345" and #gitleaks:allow
# secretKey: "not-a-secure-key" as literal defaults, which must never reach a #gitleaks:allow
# running cluster. secretKey encrypts stored registry credentials (the ACR
# password for the proxy-cache endpoint among them) and MUST be exactly 16
# characters -- Harbor fails to start otherwise.
#
# Pre-create the ASM secret before the first sync, same as
# manual-zitadel-scope-mgmt-pat:
#   aws secretsmanager create-secret --name hello-openshift/sbx/harbor \
#     --secret-string '{"admin_password":"<pw>","secret_key":"<exactly-16-chars>"}'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: harbor-admin
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: hello-openshift/sbx/harbor
        property: admin_password
    - secretKey: secretKey
      remoteRef:
        key: hello-openshift/sbx/harbor
        property: secret_key
