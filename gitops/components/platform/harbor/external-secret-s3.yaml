# Re-key the NooBaa bucket credentials into the names Harbor's registry expects.
#
# The ObjectBucketClaim publishes AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, but
# the Harbor chart's persistence.imageChartStorage.s3.existingSecret requires
# REGISTRY_STORAGE_S3_ACCESSKEY / REGISTRY_STORAGE_S3_SECRETKEY. The keys are
# generated by NooBaa at provision time, so they cannot be pinned in git and the
# rename has to happen in-cluster.
#
# ESO's kubernetes provider does this declaratively. The alternative -- a Job
# that copies the secret -- would be imperative and ArgoCD would keep fighting it.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: harbor-obc-reader
  namespace: harbor
spec:
  provider:
    kubernetes:
      remoteNamespace: harbor
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: harbor-obc-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-obc-reader
  namespace: harbor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-obc-reader
  namespace: harbor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["harbor-registry"]
  - apiGroups: [""]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-obc-reader
  namespace: harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-obc-reader
subjects:
  - kind: ServiceAccount
    name: harbor-obc-reader
    namespace: harbor
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-registry-s3
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: harbor-obc-reader
  target:
    name: harbor-registry-s3
    creationPolicy: Owner
  data:
    - secretKey: REGISTRY_STORAGE_S3_ACCESSKEY
      remoteRef:
        key: harbor-registry
        property: AWS_ACCESS_KEY_ID
    - secretKey: REGISTRY_STORAGE_S3_SECRETKEY
      remoteRef:
        key: harbor-registry
        property: AWS_SECRET_ACCESS_KEY
