# MinIO Operator
# https://min.io/docs/minio/kubernetes/upstream/
#
# This operator manages MinIO tenants on Kubernetes.
# Provides S3-compatible object storage.
# Red Hat officially partners with MinIO for OpenShift.
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: minio-operator
  namespace: openshift-operators
spec:
  channel: stable
  name: minio-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
