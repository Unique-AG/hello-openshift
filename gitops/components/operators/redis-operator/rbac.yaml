# The redis-operator 0.15.1 CSV grants redis/redisclusters but omits
# redisreplications and redissentinels — the operator crash-loops on
# informer cache sync without these.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-operator-missing-crs
rules:
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-operator-missing-crs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-operator-missing-crs
subjects:
  - kind: ServiceAccount
    name: redis-operator
    namespace: openshift-operators
