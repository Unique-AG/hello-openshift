# web-app-knowledge-upload — the Unique knowledge-base upload UI (chart
# oci://uniquecr.azurecr.io/helm/knowledge-upload-app 2026.37.0, pulled via the
# ArgoCD uniquecr OCI repo credential in root/external-secret-argocd-uniquecr.yaml).
# Multi-source: chart + git values. Wave 6, with the other frontends. Served at
# /knowledge-upload via the Route in the chat infra app
# (chat/route-knowledge-upload.yaml).
#
# Why: the chat side menu links to /knowledge-upload ("Knowledge Base"), and with
# nothing behind that path the router returned "Application is not available".
spec:
  name: web-app-knowledge-upload
  namespace: unique
  wave: "6"
  sources:
    - repoURL: uniquecr.azurecr.io
      chart: helm/knowledge-upload-app
      targetRevision: 2026.37.0
      helm:
        releaseName: web-app-knowledge-upload
        valueFiles:
          - $values/gitops/environments/sbx/value-overlays/chat/web-app-knowledge-upload.yaml
