# Qdrant (Conduct dependency) — mirrors QA (3-system/qdrant/app.yaml,
# app name "qdrant-2", release "qdrant") into `finance-gpt`.
# QA pins the chart via its private ACR mirror digest (# 1.18.2);
# substituted with the same version from the public qdrant-helm repo.
# The qdrant-extras source (private infra repo) is SKIPPED — see
# gitops/components/conduct/README.md.
# prune: false — pruning deletes vector collections.
spec:
  name: qdrant
  namespace: finance-gpt
  wave: "5"
  sources:
    - repoURL: https://qdrant.github.io/qdrant-helm
      chart: qdrant
      targetRevision: 1.18.2
      helm:
        releaseName: qdrant
        valueFiles:
          - $values/gitops/environments/sbx/value-overlays/conduct/qdrant.yaml
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.volumeClaimTemplates[]?.status
