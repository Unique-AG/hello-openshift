# Identity layer support manifests: zitadel namespace, runtime
# credentials (ESO) and the public Route. Wave 4 (with conduct) so the
# zitadel-creds secret exists before the zitadel app's PreSync hooks
# (init/setup jobs) run at wave 5.
spec:
  name: identity
  namespace: zitadel
  wave: "4"
  path: gitops/environments/sbx/manifests/identity
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
