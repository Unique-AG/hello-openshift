# Password for the CNPG-managed `zitadel` role (postgresql.yaml
# managed.roles). kubernetes.io/basic-auth as CNPG requires for
# passwordSecret. The same ASM secret also feeds `zitadel-creds` in
# the zitadel namespace (identity layer) — ESO can't copy in-cluster
# secrets, so AWS Secrets Manager is the shared source of truth.
#
# Expected AWS Secrets Manager secret: hello-openshift/sbx/zitadel
# with properties: db_password, masterkey (32 chars).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: hello-openshift-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: zitadel
        password: "{{ .dbPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: hello-openshift/sbx/zitadel
        property: db_password
