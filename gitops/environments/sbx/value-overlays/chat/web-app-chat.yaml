# web-app-chat (chart helm/chat-app 2026.37.0) — Unique chat frontend.
# Flattened from the reference deployment's three value layers (defaults/web-apps/chat.yaml +
# sbx/values/web-apps/_all.yaml + sbx/values/web-apps/chat.yaml), adapted to
# hello-openshift:
#   - domain of the reference deployment -> <DOMAIN_BASE> (single host,
#     path-based; there is no separate api.* host, so browser-side API URLs
#     point at the same host — external backend routing on one host is a known
#     gap, tracked in the app-of-apps README/report).
#   - image via the in-cluster Harbor proxy cache (<REGISTRY_HOST>)
#     instead of the reference deployment's ap-northeast-2 mirror; pull by tag (useDigest:false).
#     The uniquecr/ prefix is a Harbor proxy-cache project pointing at
#     uniquecr.azurecr.io, so the repository path is unchanged from the ECR
#     pull-through cache this replaced.
#   - HTTPRoute/Kong Gateway paths DISABLED (no Gateway API / Kong on this
#     cluster) — exposure is an OpenShift Route (see chat/route-chat.yaml).
#   - fixed runAsUser 1000 nulled for the OpenShift restricted-v2 SCC.

# Static frontend: no /metrics, disable the base ServiceMonitor.
prometheus:
  enabled: false

image:
  registry: <REGISTRY_HOST>
  repository: uniquecr/web-app-chat
  useDigest: false
  tag: "2026.37.0"

# The base chart hardcodes runAsUser 1000 (mergeOverwrite default that a null
# override can't remove), which the OpenShift restricted-v2 SCC rejects. The
# nonroot-v2 SCC (granted to ns `unique` service accounts in components/chat/
# scc-rbac.yaml) allows this fixed non-root UID.

# Exposure is an OpenShift Route, not the chart's Kong HTTPRoutes. Disable every
# route path so no gateway.networking.k8s.io object is rendered (the base chart
# hard-fails on missing Gateway API CRDs when any path is enabled).
routes:
  hostname: <DOMAIN_BASE>
  pathPrefix: /chat
  auth:
    jwt: false
  paths:
    default:
      enabled: false
    root:
      enabled: false

replicaCount: 2

strategy:
  type: Recreate

resources:
  limits:
    cpu: 300m
    memory: 550Mi
  requests:
    cpu: 300m
    memory: 500Mi

probes:
  liveness:
    httpGet:
      path: /chat/api/health
      port: http
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /chat/api/health
      port: http
    initialDelaySeconds: 5

podAnnotations:
  reloader.stakater.com/auto: "true"

env:
  MAX_HEAP_MB: 400
  SELF_URL: https://<DOMAIN_BASE>/chat
  CHAT_APP_URL: https://<DOMAIN_BASE>/chat
  ADMIN_APP_URL: https://<DOMAIN_BASE>/admin
  KNOWLEDGE_UPLOAD_APP_URL: https://<DOMAIN_BASE>/knowledge-upload
  # Browser-side backend API URLs. Single host (no api.* subdomain yet), so these
  # target the same host with the backend path prefixes — resolved once per-backend
  # Routes / an api host exist. Set (not the chart's fail() default) so the app boots.
  CHAT_BACKEND_API_URL: https://<DOMAIN_BASE>/chat-api
  APP_REPOSITORY_BACKEND_API_URL: https://<DOMAIN_BASE>/apps
  INGESTION_BACKEND_API_URL: https://<DOMAIN_BASE>/ingestion
  SCOPE_MANAGEMENT_BACKEND_API_URL: https://<DOMAIN_BASE>/scope-management
  THEME_BACKEND_API_URL: https://<DOMAIN_BASE>/configuration
  REFLECTOR_BACKEND_API_URL: https://<DOMAIN_BASE>/reflector
  CONTENT_SECURITY_POLICY_VALUE: "default-src 'self'; img-src https: blob: data:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' blob: *.<DOMAIN_BASE> wss://*.<DOMAIN_BASE>; media-src 'self'; frame-ancestors 'self'; frame-src 'self' https://*.<DOMAIN_BASE>;"
  STATIC_BACKGROUND_COLOR: "#F7F7F7"
  STATIC_TAB_NAME: "Hello OpenShift"
  MAX_FILE_SIZE_IN_MB: "200"
  FILE_TYPES_DOCUMENT_TRANSLATOR: "docx,xlsx,pptx"
  # Zitadel OIDC — <DOMAIN_IDENTITY> (Zitadel still converging; the client
  # IDs below are reference-deployment placeholders and MUST be re-issued against this cluster's
  # Zitadel instance before auth works).
  ZITADEL_ISSUER: https://<DOMAIN_IDENTITY>
  ZITADEL_CLIENT_ID: "<ZITADEL_CLIENT_ID>"
  ZITADEL_ORG_ID: "<ZITADEL_ORG_ID>"
  ZITADEL_PROJECT_ID: "<ZITADEL_PROJECT_ID>"
  # Feature flags (frontend), aligned with the reference deployment sbx.
  FEATURE_FLAG_ENABLE_ADVANCED_FORMATTING_UN_9758: "true"
  FEATURE_FLAG_ENABLE_HTML_RENDERING_UN_15131: "true"
  FEATURE_FLAG_ENABLE_NEW_ANSWERS_UI_UN_14411: "true"
  FEATURE_FLAG_ENABLE_NEW_ANSWER_FORMATTING_UN_14392: "true"
  FEATURE_FLAG_ENABLE_THINKING_STEPS_UN_13848: "true"
  FEATURE_FLAG_ENABLE_SPACES_2_0_UN_11203: "true"
  FEATURE_FLAG_ENABLE_SPACE_LANDING_PAGE_UN_9930: "true"
  FEATURE_FLAG_ENABLE_END_USER_SPACE_UN_8855: "true"
  FEATURE_FLAG_NEW_SOURCE_REFERENCES_UN_10906: "true"
  FEATURE_FLAG_SIDE_MENU_NAVIGATION: "true"

# {} not null — the per-app chart schema rejects null.
nodeSelector: {}
