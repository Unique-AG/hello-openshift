# RabbitMQ connection for the chat/app-repository backends. the reference deployment's charts read
# AMQP_{USERNAME,PASSWORD,HOST,PORT} from a secret named
# rabbitmqcluster-chat-default-user (the RabbitMQ-operator default-user secret
# name on QA). This cluster runs the bitnami RabbitMQ release in `eventing`, so
# the secret is reconstructed here from ASM hello-openshift/sbx/rabbitmq with
# host/port pointed at the in-cluster service.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmqcluster-chat-default-user
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rabbitmqcluster-chat-default-user
    creationPolicy: Owner
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        host: rabbitmq-orange-wolf.eventing.svc.cluster.local
        port: "5672"
  data:
    - secretKey: username
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: password
