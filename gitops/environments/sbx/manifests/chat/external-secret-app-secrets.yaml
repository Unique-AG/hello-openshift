# Per-service secret env for the chat + assistants-core backends. These carry
# app-specific secrets that CANNOT be derived from cluster state and are
# USER-OWNED blockers (like rabbitmq/litellm/peer-pods). Populate the ASM
# secrets below, then ESO extracts every property into the k8s secret and the
# chart's extraEnvSecrets mounts them as env (envFrom).
#
# Required ASM secret hello-openshift/sbx/chat-secrets (JSON) — at least:
#   CHAT_LXM_ENCRYPTION_KEY        32-byte key for at-rest field encryption
#   JWT_PUBLIC_KEY                 Zitadel JWT verification public key (PEM)
#   AZURE_OPENAI_API_ENDPOINTS_JSON  node-chat default-model factory seed, e.g.
#     [{"endpoint":"http://litellm.system.svc:4000","key":"<litellm PROXY_MASTER_KEY>",
#       "location":"<AWS_REGION>",
#       "models":[{"modelName":"gpt-4o","modelVersion":"2024-11-20",
#                  "deploymentName":"anthropic-claude-sonnet-4-5"}]}]
#   (add SEND_GRID_API_KEY / S3 creds / MCP token secrets as features are enabled)
#
# Required ASM secret hello-openshift/sbx/assistants-core-secrets (JSON) — at least:
#   OPENAI_API_KEY   the LiteLLM PROXY_MASTER_KEY
#   OPENAI_BASE_URL  http://litellm.system.svc:4000
#   (add BING/TAVILY/FIRECRAWL/JINA/QUARTR keys as tools are enabled)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chat-secrets
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: chat-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hello-openshift/sbx/chat-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: assistants-core-secrets
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: assistants-core-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hello-openshift/sbx/assistants-core-secrets
---
# scope-management app secrets. DATABASE_URL is NOT here — the chart builds it
# in structured mode from the chat-db ExternalSecret (see values/scope-management.yaml).
# The only genuinely non-derivable key is ZITADEL_PAT, a Zitadel Personal Access
# Token that must have IAM_OWNER to register the user-sync webhook / drive IDP
# sync. Seeded with a PLACEHOLDER so the pod starts (webhook + assistant sync are
# disabled in values); replace ASM hello-openshift/sbx/scope-management-secrets
# with a real IAM_OWNER PAT to enable Zitadel user sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scope-management-secrets
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: scope-management-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hello-openshift/sbx/scope-management-secrets
---
# node-ingestion secret env. The only non-derivable key is the embedding
# credential: the service speaks "Azure OpenAI" env names but points at the
# in-cluster LiteLLM proxy, so AZURE_OPENAI_API_KEY is the LiteLLM
# PROXY_MASTER_KEY (ASM hello-openshift/sbx/litellm).
#
# Required ASM secret hello-openshift/sbx/ingestion-secrets (JSON):
#   AZURE_OPENAI_API_KEY      the LiteLLM PROXY_MASTER_KEY
#   INGESTION_ENCRYPTION_KEY  32-byte key (base64) for at-rest field encryption.
#     MANDATORY — without it the pod refuses to boot: ScopedAPIController throws
#     "INGESTION_ENCRYPTION_KEY not set in ENV variables" and the chart's
#     migration hook Job fails, so the whole app never syncs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ingestion-secrets
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ingestion-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hello-openshift/sbx/ingestion-secrets
