# Postgres app_user password, mirrored from AWS Secrets Manager into `unique`
# so the backend charts can build DATABASE_URL (postgresql.connection.password.
# fromSecret -> this secret). The CNPG app secret lives in hello-openshift-data;
# ASM secret hello-openshift/sbx/chat-db carries the same app_user password
# (seeded from `kubectl get secret hello-openshift-postgres-app`).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chat-db
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: chat-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: hello-openshift/sbx/chat-db
        property: password
    - secretKey: username
      remoteRef:
        key: hello-openshift/sbx/chat-db
        property: username
