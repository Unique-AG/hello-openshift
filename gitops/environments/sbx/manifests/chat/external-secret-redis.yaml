# Redis password for node-chat (Opstree Redis requires AUTH). Same ASM
# source as the data-services redis-auth, materialized into ns unique.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: hello-openshift/sbx/redis
        property: password
