# Zitadel runtime credentials, mirrored from QA
# (qa/gitops/3-system/zitadel/secrets.yaml `zitadel-creds`), source
# substituted: QA reads Azure Key Vault, we read AWS Secrets Manager.
#
# QA also carries host/port/database in this secret; here those are
# static chart values (configmapConfig.Database.Postgres). The DB
# password is the CNPG-managed `zitadel` role's password — the same
# ASM property also feeds `zitadel-db-credentials` in
# hello-openshift-data (data-services layer), which is how the role
# gets that password in the first place. QA's `zitadel-smtp-creds`
# (SendGrid) is SKIPPED — no SMTP in sbx.
#
# Expected AWS Secrets Manager secret: hello-openshift/sbx/zitadel
# with properties: db_password, masterkey (32 chars).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-creds
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: zitadel-creds
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: hello-openshift/sbx/zitadel
        property: masterkey
    - secretKey: password
      remoteRef:
        key: hello-openshift/sbx/zitadel
        property: db_password
