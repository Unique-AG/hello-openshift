# First public route through CloudFront -> VPC origin -> ALB -> router.
# TLS terminates at CloudFront/ALB; traffic reaches the router as plain
# HTTP:80, so this is a non-TLS Route (a tls/redirect policy would loop).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hubble-ui
  namespace: cilium
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # path-less on the shared host shadowed /chat -> moved under /hubble;
    # rewrite-target strips the prefix so hubble-ui still serves at its root
    haproxy.router.openshift.io/rewrite-target: /
spec:
  host: <DOMAIN_BASE>
  path: /hubble
  to:
    kind: Service
    name: hubble-ui
  port:
    targetPort: http
