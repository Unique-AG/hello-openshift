# AWS credentials for launching pod VMs — sourced from Secrets Manager
# (hello-openshift/sbx/peer-pods, created out-of-band with the AWS CLI so
# no key material enters Terraform state).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: peer-pods-secret
  namespace: openshift-sandboxed-containers-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: peer-pods-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: hello-openshift/sbx/peer-pods
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: hello-openshift/sbx/peer-pods
        property: secret_access_key
