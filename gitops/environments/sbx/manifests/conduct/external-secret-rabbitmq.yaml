# RabbitMQ credentials, mirrored from QA
# (qa/gitops/3-system/rabbitmq/{admin-credentials,definition}.secret.yaml).
#
# QA uses ClusterExternalSecret to fan the admin secret out into every
# consumer namespace (bot, python, ...). Those namespaces don't exist
# here yet, so plain ExternalSecrets in `eventing` suffice. The
# `rabbitmq-cluster-service-binding` fan-out secret is SKIPPED for the
# same reason.
#
# Expected AWS Secrets Manager secret: hello-openshift/sbx/rabbitmq
# with properties: username (must be "admin", see values comment),
# password, erlangCookie, consumerUsername, consumerPassword.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmq-admin-credentials
  namespace: eventing
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rabbitmq-admin-credentials
    creationPolicy: Owner
    template:
      data:
        connection_string_amqp: amqp://{{ .username }}:{{ .password }}@rabbitmq-orange-wolf-headless.eventing:5672/%2f # %2f is url encoded /
        connection_string_http: http://{{ .username }}:{{ .password }}@rabbitmq-orange-wolf-headless.eventing:15672/%2f # %2f is url encoded /
        erlang_cookie: "{{ .erlangCookie }}"
        host_amqp: amqp://rabbitmq-orange-wolf-headless.eventing:5672/%2f # %2f is url encoded /
        host_http: http://rabbitmq-orange-wolf-headless.eventing:15672/%2f # %2f is url encoded /
        password: "{{ .password }}"
        port: "5672"
        provider: rabbitmq
        type: rabbitmq
        username: "{{ .username }}"
        vhostName: /
  data:
    - secretKey: username
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: password
    - secretKey: erlangCookie
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: erlangCookie
---
# Definitions loaded by RabbitMQ at boot (loadDefinition.existingSecret).
# JSON body mirrors QA verbatim (users, permissions, consumer-timeout
# policies).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmq-load-definition
  namespace: eventing
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rabbitmq-load-definition
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        load_definition.json: |
          {
            "vhosts": [{ "name": "/" }],
            "users": [
              {
                "name": "{{ .rabbitmqAdminUser }}",
                "password": "{{ .rabbitmqAdminPassword }}",
                "tags": "administrator"
              },
              {
                "name": "{{ .rabbitmqConsumerUser }}",
                "password": "{{ .rabbitmqConsumerPassword }}",
                "tags": ""
              }
            ],
            "permissions": [
              {
                "user": "{{ .rabbitmqAdminUser }}",
                "vhost": "/",
                "configure": ".*",
                "read": ".*",
                "write": ".*"
              },
              {
                "user": "{{ .rabbitmqConsumerUser }}",
                "vhost": "/",
                "configure": ".*",
                "read": ".*",
                "write": ".*"
              }
            ],
            "policies": [
              {
                "vhost": "/",
                "name": "whisper-consumer-timeout",
                "pattern": "unique.python.whisper",
                "apply-to": "queues",
                "definition": { "consumer-timeout": 14400000 },
                "priority": 2
              },
              {
                "vhost": "/",
                "name": "python-consumer-timeout",
                "pattern": "unique.python*",
                "apply-to": "queues",
                "definition": { "consumer-timeout": 7200000 },
                "priority": 1
              },
              {
                "vhost": "/",
                "name": "bot-consumer-timeout",
                "pattern": "unique.bot*",
                "apply-to": "all",
                "definition": { "consumer-timeout": 14400000 },
                "priority": 1
              },
              {
                "vhost": "/",
                "name": "node-consumer-timeout",
                "pattern": "unique.node.ingestion.queue",
                "apply-to": "queues",
                "definition": { "consumer-timeout": 7200000 },
                "priority": 1
              },
              {
                "vhost": "/",
                "name": "node-ingestion-chat-timeout",
                "pattern": "unique.node.ingestion.chat_queue",
                "apply-to": "queues",
                "definition": { "consumer-timeout": 7200000 },
                "priority": 1
              }
            ]
          }
  data:
    - secretKey: rabbitmqAdminUser
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: username
    - secretKey: rabbitmqAdminPassword
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: password
    - secretKey: rabbitmqConsumerUser
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: consumerUsername
    - secretKey: rabbitmqConsumerPassword
      remoteRef:
        key: hello-openshift/sbx/rabbitmq
        property: consumerPassword
