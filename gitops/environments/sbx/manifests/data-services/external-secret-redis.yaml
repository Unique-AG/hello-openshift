# Syncs the Redis password from AWS Secrets Manager (created by
# terraform/1-foundation/secrets.tf) into the redis-auth secret the
# Opstree CRs reference. Env-specific: the remoteRef key carries sbx.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: hello-openshift-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: hello-openshift/sbx/redis
        property: password
