# Renders the config.env file the MinIO Tenant's spec.configuration
# expects, from the root credentials in AWS Secrets Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-env-config
  namespace: hello-openshift-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: minio-env-config
    creationPolicy: Owner
    template:
      data:
        config.env: |
          export MINIO_ROOT_USER="{{ .root_user }}"
          export MINIO_ROOT_PASSWORD="{{ .root_password }}"
  data:
    - secretKey: root_user
      remoteRef:
        key: hello-openshift/sbx/minio
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: hello-openshift/sbx/minio
        property: root_password
