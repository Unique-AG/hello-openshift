# ArgoCD OCI Helm repository credential for uniquecr.azurecr.io — lets ArgoCD
# pull the Unique per-app charts (oci://uniquecr.azurecr.io/helm/<name>). The
# secret is labeled argocd.argoproj.io/secret-type: repository so ArgoCD picks
# it up as a repo credential. Materialized by ESO from ASM hello-openshift/sbx/
# acr-pull ({username, password}); applied to openshift-gitops by the root app.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-uniquecr
  namespace: openshift-gitops
  annotations:
    # Wave 3, NOT 0: this ExternalSecret depends on two things the root app
    # creates itself — the ESO CRD (operators app, wave 1) and the
    # ClusterSecretStore aws-secrets-manager (platform app, wave 2). At wave 0
    # it was ordered ahead of both, which only ever worked because ESO already
    # happened to be installed; on a rebuilt cluster it deadlocks the root sync.
    argocd.argoproj.io/sync-wave: "3"
    # Waves alone are not enough. ArgoCD dry-run-validates EVERY task before
    # any wave executes, so a missing CRD fails the WHOLE sync with "one or
    # more synchronization tasks are not valid" and nothing at all is applied —
    # including the operators Application that would install the CRD. This
    # option skips the dry run while the CRD is absent, breaking the cycle.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-repo-uniquecr
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        url: uniquecr.azurecr.io
        name: uniquecr-oci
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hello-openshift/sbx/acr-pull
        property: username
    - secretKey: password
      remoteRef:
        key: hello-openshift/sbx/acr-pull
        property: password
