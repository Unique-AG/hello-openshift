# backend-service-scope-management — chart oci://uniquecr.azurecr.io/helm/scope-management
# 2026.34.4 (uniquecr OCI repo cred). Multi-source: chart + git values. Wave 6.
# Deployed into `unique`. node-chat's migration depends on this service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-service-scope-management
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: hello-openshift
  sources:
    - repoURL: uniquecr.azurecr.io
      chart: helm/scope-management
      targetRevision: 2026.34.4
      helm:
        releaseName: backend-service-scope-management
        skipSchemaValidation: true
        valueFiles:
          - $values/gitops/environments/sbx/chat/values/scope-management.yaml
    - repoURL: git@github.com:Unique-AG/hello-openshift.git
      targetRevision: deploy
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: unique
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
