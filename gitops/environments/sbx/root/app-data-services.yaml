# prune: false — pruning here deletes databases. Deliberate removals
# are done with an explicit `argocd app sync --prune`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-services
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: hello-openshift
  # ESO's webhook defaults these; without ignoring them every
  # ExternalSecret shows permanent OutOfSync drift
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
  source:
    repoURL: git@github.com:Unique-AG/hello-openshift.git
    targetRevision: deploy
    path: gitops/environments/sbx/data-services
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-openshift-data
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
