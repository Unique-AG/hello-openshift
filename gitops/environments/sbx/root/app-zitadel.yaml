# Zitadel (IAM) — mirrors QA (3-system/zitadel/app.yaml): chart
# 9.34.1 into `zitadel`. QA pins the OCI mirror at a digest
# (# 9.34.1); substituted with the same version from the official
# chart repo. Namespace/creds/route ship with the identity app
# (wave 4); wave 5 so the zitadel-creds secret exists before the
# chart's init/setup jobs (helm pre-install hooks -> ArgoCD PreSync)
# run. prune: false — pruning an IAM system locks everyone out.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: hello-openshift
  sources:
    - repoURL: https://charts.zitadel.com
      chart: zitadel
      targetRevision: 9.34.1
      helm:
        releaseName: zitadel
        valueFiles:
          - $values/gitops/environments/sbx/identity/values/zitadel.yaml
    - repoURL: git@github.com:Unique-AG/hello-openshift.git
      targetRevision: deploy
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
