# web-app-chat — the Unique chat frontend (chart oci://uniquecr.azurecr.io/
# helm/chat-app 2026.34.4, pulled via the ArgoCD uniquecr OCI repo credential
# in root/external-secret-argocd-uniquecr.yaml). Multi-source: chart + git
# values. Wave 6 (after chat infra wave 5). Served at /chat via the OpenShift
# Route in the chat infra app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app-chat
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: hello-openshift
  sources:
    - repoURL: uniquecr.azurecr.io
      chart: helm/chat-app
      targetRevision: 2026.34.4
      helm:
        releaseName: web-app-chat
        valueFiles:
          - $values/gitops/environments/sbx/chat/values/web-app-chat.yaml
    - repoURL: git@github.com:Unique-AG/hello-openshift.git
      targetRevision: deploy
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: unique
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
