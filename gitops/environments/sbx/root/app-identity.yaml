# Identity layer support manifests: zitadel namespace, runtime
# credentials (ESO) and the public Route. Wave 4 (with conduct) so the
# zitadel-creds secret exists before the zitadel app's PreSync hooks
# (init/setup jobs) run at wave 5.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: hello-openshift
  # ESO's webhook defaults these; without ignoring them every
  # ExternalSecret shows permanent OutOfSync drift
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
  source:
    repoURL: git@github.com:Unique-AG/hello-openshift.git
    targetRevision: deploy
    path: gitops/environments/sbx/identity
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
