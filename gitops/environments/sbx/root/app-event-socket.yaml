# backend-service-event-socket — chart oci://uniquecr.azurecr.io/helm/event-socket
# 2026.37.0 (uniquecr OCI repo cred). Multi-source: chart + git values. Wave 6.
# Deployed into `unique`. Websocket event relay backed by RabbitMQ.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-service-event-socket
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: hello-openshift
  sources:
    - repoURL: uniquecr.azurecr.io
      chart: helm/event-socket
      targetRevision: 2026.37.0
      helm:
        releaseName: backend-service-event-socket
        skipSchemaValidation: true
        valueFiles:
          - $values/gitops/environments/sbx/chat/values/event-socket.yaml
    - repoURL: git@github.com:Unique-AG/hello-openshift.git
      targetRevision: deploy
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: unique
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
