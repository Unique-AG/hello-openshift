# Harbor — the cluster's image registry, replacing the ECR pull-through cache.
#
# Sync wave 3: after platform (wave 2) so ODF/NooBaa is Healthy and the
# ObjectBucketClaim is bound, and before conduct (4) / chat (5) / backends (6)
# whose images are pulled THROUGH Harbor. ArgoCD holds a wave until the previous
# one is healthy, which is exactly the ordering guarantee this needs.
#
# prune: false, mirroring the cilium app. Pruning the registry every workload
# pulls from would be self-inflicted downtime.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: hello-openshift
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.19.2
      helm:
        valueFiles:
          - $values/gitops/environments/sbx/platform/values/harbor.yaml
    - repoURL: git@github.com:Unique-AG/hello-openshift.git
      targetRevision: deploy
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
