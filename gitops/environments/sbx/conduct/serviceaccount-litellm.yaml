# The litellm ServiceAccount, owned HERE rather than by the litellm chart.
#
# The chart's migration Job is an ArgoCD PreSync hook (migrationJob.hooks.argocd
# .enabled: true — needed, because with the Helm hook the job never ran and the
# database stayed empty, which surfaced as LiteLLM 403ing every request). But a
# PreSync hook runs before ANY resource in that app's sync, including the
# ServiceAccount the chart would create — so on a cluster where the SA does not
# already exist the Job can never start a pod:
#
#   pods "litellm-migrations-" is forbidden: error looking up service account
#   system/litellm: serviceaccount "litellm" not found
#
# The Job then sits Running with 0/1 completions and no pod, the litellm app
# never reports Healthy, and because the root app-of-apps waits on wave 5 health
# the entire wave 6 (all the chat backends and web apps) is never created. One
# missing ServiceAccount stalls the whole rollout.
#
# Note a *tracked SA inside the litellm app* would NOT fix this — PreSync
# precedes every sync wave of its own app. It has to be created by an earlier
# app: conduct is wave 4, litellm is wave 5.
#
# This never showed up in July because the SA already existed from an earlier
# sync; it only appears on a from-scratch bootstrap. Same shape as the zitadel
# ServiceAccount problem — see gitops/components/identity/zitadel/
# serviceaccount.yaml — and paired with serviceAccount.create: false in
# gitops/environments/sbx/conduct/values/litellm.yaml.
#
# scc-litellm-anyuid.yaml already binds anyuid to this exact SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: system
