# LiteLLM runtime secret (chart consumes it via environmentSecrets +
# masterkeySecretName). QA renders this from Azure Key Vault through
# the private litellm-extras chart — replaced here by a plain
# ExternalSecret from AWS Secrets Manager.
#
# Expected AWS Secrets Manager secret: hello-openshift/sbx/litellm
# with properties: DATABASE_URL, PROXY_MASTER_KEY, ANTHROPIC_API_KEY.
# (QA additionally wires OPENAI/GEMINI/XAI/TogetherAI/Pulsar/AWS keys;
# add properties + entries below when those providers are needed.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: litellm
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: hello-openshift/sbx/litellm
        property: DATABASE_URL
    - secretKey: PROXY_MASTER_KEY
      remoteRef:
        key: hello-openshift/sbx/litellm
        property: PROXY_MASTER_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: hello-openshift/sbx/litellm
        property: ANTHROPIC_API_KEY
