# RabbitMQ (bitnami chart 16.0.14) — mirrored from QA
# (qa/gitops/3-system/rabbitmq/values.yaml) with Azure bits trimmed.
#
# SKIPPED vs QA:
#   - global.imagePullSecrets (ACR pull secret image-pull-secret-v2026.05)
#   - ingress (Tailscale ingress class + *.ts.net hosts, QA-only)
auth:
  existingErlangSecret: rabbitmq-admin-credentials
  existingSecretErlangKey: erlang_cookie
  existingPasswordSecret: rabbitmq-admin-credentials
  existingSecretPasswordKey: password
  username: admin # must match name from secrets, bitnami chart lacks support for loading username from secret
clustering:
  enabled: false
extraConfiguration: |
  load_definitions = /app/load_definition.json
  queue_index_embed_msgs_below = 4096
  max_message_size = 134217728
  log.exchange.level = error
  mqtt.exchange = amq.topic
extraPlugins: rabbitmq_consistent_hash_exchange rabbitmq_management_agent rabbitmq_web_dispatch
global:
  security:
    allowInsecureImages: true # image below is not in the default bitnami repo
image:
  # QA pulls this through the private ACR mirror
  # (uniqueapp.azurecr.io/docker.io/...) — substituted with the public
  # Docker Hub source it mirrors.
  registry: docker.io
  repository: bitnamilegacy/rabbitmq
  tag: 4.1.3-debian-12-r1
loadDefinition:
  enabled: true
  existingSecret: rabbitmq-load-definition
memoryHighWatermark:
  enabled: true
  type: relative
  value: 0.81
metrics:
  enabled: true
  prometheusRule:
    enabled: true
    namespace: eventing
    # These are just examples rules inspired from https://awesome-prometheus-alerts.grep.to/rules.html
    rules:
      - alert: RabbitmqClusterNodesBelowRequired
        expr: sum(rabbitmq_build_info{service="rabbitmq-orange-wolf"}) < 1
        for: 10m
        labels:
          severity: critical
          team: infra
      - alert: RabbitmqNodeNotDistributed
        # The state is represented as a numerical value where `pending=1', `up_pending=2' and `up=3'
        expr: erlang_vm_dist_node_state{service="rabbitmq-orange-wolf",peer!~"rabbitmqcli-.*"} < 3
        for: 2m
        labels:
          severity: critical
          team: infra
      - alert: RabbitmqMemoryOverHighWatermark
        expr: rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes > 0.81
        for: 2m
        labels:
          severity: critical
          team: infra
      - alert: RabbitmqTooManyUnackMessages
        expr: sum(rabbitmq_queue_messages_unacked) by (queue) > 100
        for: 2m
        labels:
          severity: warning
          team: infra
      - alert: RabbitmqConnectionDrop
        annotations:
          description: RabbitMQ connections decreased drastically over last 30 minutes
          summary: RabbitMQ connections dropped by more than 50% for over 30 minutes
        expr: rabbitmq_connections / (rabbitmq_connections offset 30m) < 0.5
        for: 30m
        labels:
          severity: warning
          team: infra
      - alert: RabbitmqNoQueueConsumer
        expr: sum by (service)(rabbitmq_queue_consumers) < 1
        for: 2m
        labels:
          severity: warning
          team: infra
      - alert: RabbitmqUnroutableMessages
        expr: increase(rabbitmq_channel_messages_unroutable_returned_total[1m]) > 0 or increase(rabbitmq_channel_messages_unroutable_dropped_total[1m]) > 3
        for: 15m
        labels:
          severity: critical
          team: infra
  serviceMonitor:
    jobLabel: orange-wolf
    namespace: eventing
    default:
      enabled: true
    detailed:
      enabled: true
      family:
        [
          "connection_churn_metrics",
          "queue_coarse_metrics",
          "queue_delivery_metrics",
          "queue_consumer_count",
          "queue_metrics",
        ]
nameOverride: orange-wolf # legacy naming from CloudAMQP, kept so service/host names match QA
pdb:
  create: false
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
replicaCount: 1
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi
tcpListenOptions:
  keepalive: true
# OpenShift-only (not in QA): let the restricted-v2 SCC assign UIDs and
# fsGroup from the namespace range; the chart's fixed 1001 would be
# rejected by SCC admission. Bitnami images are arbitrary-UID safe.
podSecurityContext:
  enabled: false
containerSecurityContext:
  enabled: false
