# backend-service-app-repository (chart helm/app-repository 2026.34.4).
# Flattened from the reference deployment (defaults/backend-services/app-repository.yaml +
# sbx/values/backend-services/{_all,app-repository}.yaml), adapted:
#   - image via the ECR pull-through cache.
#   - Kong HTTPRoutes DISABLED (no Gateway API); reachable in-cluster at
#     app-repository.unique.svc:8088. External /apps routing pending an api host.
#   - DATABASE_URL built by the chart in structured mode from the in-cluster
#     CNPG cluster (app_repository DB, app_user), password from the chat-db
#     ExternalSecret — replaces the reference deployment's baked extraEnvSecrets DSN.
#   - AMQP_* from the rabbitmqcluster-chat-default-user ExternalSecret.

image:
  registry: harbor.openshift.example.com
  repository: uniquecr/backend-service-app-repository
  useDigest: false
  tag: "2026.34.4"

# Disable the Kong HTTPRoutes (no Gateway API CRDs on this cluster).
routes:
  hostname: openshift.example.com
  pathPrefix: /apps
  paths:
    default:
      enabled: false
    probe:
      enabled: false

postgresql:
  enabled: true
  connection:
    host: hello-openshift-postgres-rw.hello-openshift-data.svc.cluster.local
    port: 5432
    database: app_repository
    username: app_user
    password:
      fromSecret:
        name: chat-db
        key: password
    # CNPG accepts TLS without client CA verification; `require` avoids needing
    # the cluster CA mounted for hostname verification.
    sslMode: require

prometheus:
  enabled: false

secretProvider: {}

env:
  LOG_LEVEL: info
  MAX_HEAP_MB: 400
  ADMIN_FRONTEND_URL: https://openshift.example.com/admin
  CHAT_FRONTEND_URL: https://openshift.example.com/chat
  CORS_ALLOWED_ORIGINS: https://openshift.example.com
  UNIQUE_INSTALLATION_ID: openshift.example.com
  ZITADEL_HOST: https://id.openshift.example.com
  ZITADEL_PROJECT_ID: "<project-id>"
  ZITADEL_ROOT_ORG_ID: "<root-org-id>"
  CONFIGURATION_BACKEND_URL: http://configuration-backend.unique.svc:8095
  SCOPE_MANAGEMENT_API_URL: http://scope-management.unique.svc:8094

# AMQP connection from the rabbitmqcluster-chat-default-user ExternalSecret.
envVars:
  - name: AMQP_USERNAME
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: username
  - name: AMQP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: password
  - name: AMQP_HOST
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: host
  - name: AMQP_PORT
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: port

serviceAccount:
  enabled: true
  workloadIdentity:
    enabled: false

podAnnotations:
  reloader.stakater.com/auto: "true"

nodeSelector: {}

keda:
  skipCrdCheck: true

# the reference deployment runs external infra; disable the bundled subcharts.
rabbitmq:
  enabled: false
  connection: {}
redis:
  enabled: false
  connection: {}
qdrant:
  enabled: false
  connection: {}
elasticsearch:
  enabled: false
  connection: {}
litellm:
  enabled: false
  connection: {}

replicaCount: 1

resources:
  limits:
    memory: 550Mi
  requests:
    cpu: 300m
    memory: 500Mi
