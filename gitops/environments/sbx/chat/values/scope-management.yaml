# backend-service-scope-management (chart helm/scope-management 2026.34.4) —
# node-scope-management. node-chat's migration calls this service's GraphQL, so
# it must be Running before the chat migration can complete.
# Flattened from the reference deployment (defaults/backend-services/scope-management.yaml +
# sbx/values/backend-services/{_all,scope-management}.yaml), adapted:
#   - image via the ECR pull-through cache (123456789012 / uniquecr).
#   - Kong/Gateway-API HTTPRoutes DISABLED (no Gateway API CRDs on this cluster);
#     reachable in-cluster at scope-management.unique.svc:8094.
#   - DATABASE_URL built by the chart in structured mode from the in-cluster CNPG
#     cluster (scope_management DB, app_user), password from the chat-db
#     ExternalSecret — replaces the reference deployment's baked psql-connection-string DSN.
#   - AMQP_* from the rabbitmqcluster-chat-default-user ExternalSecret.
#   - Zitadel gRPC -> zitadel.zitadel.svc:8080 (h2c; in-cluster it carries HTTP/2
#     end-to-end, unlike the public router path). ZITADEL_PAT comes from the
#     scope-management-secrets ExternalSecret (ASM hello-openshift/sbx/
#     scope-management-secrets). The auto-registered Zitadel webhook + assistant
#     sync are DISABLED here — they require a real IAM_OWNER PAT (user-owned).

image:
  registry: harbor.openshift.example.com
  repository: uniquecr/backend-service-scope-management
  useDigest: false
  tag: "2026.34.4"

# Disable the Kong/Gateway-API HTTPRoutes (no Gateway API CRDs on this cluster).
# hostname is a mandatory value even when every path is disabled.
routes:
  hostname: openshift.example.com
  pathPrefix: /scope-management
  paths:
    default:
      enabled: false
    probe:
      enabled: false

extraRoutes:
  scim:
    enabled: false
  membership-sync:
    enabled: false

postgresql:
  enabled: true
  connection:
    host: hello-openshift-postgres-rw.hello-openshift-data.svc.cluster.local
    port: 5432
    database: scope_management
    username: app_user
    password:
      fromSecret:
        name: chat-db
        key: password
    sslMode: require

prometheus:
  enabled: false

secretProvider: {}

env:
  LOG_LEVEL: info
  MAX_HEAP_MB: "750"
  AUDIT_LOG_DIR: /dev/stdout
  UNIQUE_INSTALLATION_ID: openshift.example.com
  ADMIN_FRONTEND_URL: https://openshift.example.com/admin
  CHAT_FRONTEND_URL: https://openshift.example.com/chat
  CORS_ALLOWED_ORIGINS: https://openshift.example.com
  ZITADEL_HOST: https://id.openshift.example.com
  ZITADEL_PROJECT_ID: "<project-id>"
  ZITADEL_ROOT_ORG_ID: "<root-org-id>"
  # In-cluster gRPC to Zitadel (h2c, HTTP/2 end-to-end — bypasses the router).
  ZITADEL_GRPC_HOST: http://zitadel.zitadel.svc.cluster.local:8080
  ZITADEL_INTERNAL_HOST: http://zitadel.zitadel.svc.cluster.local:8080
  CHAT_API_URL: http://chat.unique.svc:8093
  CONFIGURATION_BACKEND_URL: http://configuration-backend.unique.svc:8095
  INGESTION_API_URL: http://ingestion.unique.svc:8091
  # Zitadel webhook auto-registration requires an IAM_OWNER PAT (user-owned):
  # disable it so the pod boots with a placeholder PAT. The 5-min user-sync
  # CronJob is the fallback once a real PAT is supplied.
  ZITADEL_WEBHOOK_ENDPOINT: ""
  # Assistant/access IDP sync also needs a real PAT — off until one is provided.
  DISABLE_ASSISTANT_SYNC: "true"
  DISABLE_ASSISTANT_ACCESS_SYNC: "true"

envVars:
  - name: AMQP_USERNAME
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: username
  - name: AMQP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: password
  - name: AMQP_HOST
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: host
  - name: AMQP_PORT
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: port

extraEnvSecrets:
  - scope-management-secrets

serviceAccount:
  enabled: true
  workloadIdentity:
    enabled: false

podAnnotations:
  reloader.stakater.com/auto: "true"

nodeSelector: {}

keda:
  skipCrdCheck: true

rabbitmq:
  enabled: false
  connection: {}

replicaCount: 1

resources:
  limits:
    cpu: 1
    memory: 900Mi
  requests:
    cpu: 500m
    memory: 850Mi
