# backend-service-event-socket (chart helm/event-socket 2026.34.4) —
# typescript-event-socket. Relays backend events (RabbitMQ) to the chat
# frontend over websockets. node-chat publishes to it.
# Flattened from the reference deployment (defaults/backend-services/event-socket.yaml +
# sbx/values/backend-services/{_all,event-socket}.yaml), adapted:
#   - image via the ECR pull-through cache (123456789012 / uniquecr).
#   - Kong/Gateway-API HTTPRoutes DISABLED (no Gateway API CRDs on this cluster);
#     reachable in-cluster at event-socket.unique.svc.
#   - AMQP_* from the rabbitmqcluster-chat-default-user ExternalSecret.
#   - No database (event-socket is stateless — RabbitMQ-backed relay).

image:
  registry: harbor.openshift.example.com
  repository: uniquecr/backend-service-event-socket
  useDigest: false
  tag: "2026.34.4"

routes:
  hostname: openshift.example.com
  pathPrefix: /event-socket
  paths:
    default:
      enabled: false
    versioned:
      enabled: false
    probe:
      enabled: false

prometheus:
  enabled: false

secretProvider: {}

env:
  LOG_LEVEL: info
  MAX_HEAP_MB: "200"
  UNIQUE_INSTALLATION_ID: openshift.example.com
  CORS_ALLOWED_ORIGINS: https://openshift.example.com

envVars:
  - name: AMQP_USERNAME
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: username
  - name: AMQP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: password
  - name: AMQP_HOST
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: host
  - name: AMQP_PORT
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: port

serviceAccount:
  enabled: true
  workloadIdentity:
    enabled: false

podAnnotations:
  reloader.stakater.com/auto: "true"

nodeSelector: {}

keda:
  skipCrdCheck: true

rabbitmq:
  enabled: false
  connection: {}

replicaCount: 1

resources:
  limits:
    cpu: 200m
    memory: 350Mi
  requests:
    cpu: 100m
    memory: 300Mi
