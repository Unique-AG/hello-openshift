# backend-service-ingestion (chart helm/ingestion 2026.34.4) — node-ingestion.
#
# Why it is here: the chat frontend calls /ingestion/graphql unconditionally, and
# with no service behind that path the Route 503s and the chat DETAIL view
# (/chat/chat_<id>) hard-fails with "Something went wrong". The space view and
# sending messages work without it, but the conversation view does not.
#
# Flattened from the reference deployment (defaults/backend-services/ingestion.yaml +
# sbx/values/backend-services/{_all,ingestion}.yaml), adapted:
#   - image via the ECR pull-through cache (123456789012 / uniquecr).
#   - Kong/Gateway-API HTTPRoutes DISABLED (no Gateway API CRDs on this cluster);
#     reachable in-cluster at ingestion.unique.svc:8091, publicly via the
#     OpenShift Route in chat/route-ingestion.yaml.
#   - DATABASE_URL built by the chart in structured mode from the in-cluster CNPG
#     cluster (`ingestion` DB, app_user), password from the chat-db ExternalSecret.
#   - ELASTICSEARCH DISABLED — no ECK/Elasticsearch on this cluster. Both search
#     feature flags are forced off, so retrieval uses the Qdrant path only. This
#     also drops the reference deployment's elastic-certs volume/volumeMounts and its
#     ELASTICSEARCH_* env + es-indexing cron job.
#   - Qdrant is the conduct release in ns finance-gpt (fullnameOverride
#     qdrant-frosty-mud), not the reference deployment's qdrant-headless.unique.
#   - Embeddings go through the in-cluster LiteLLM proxy using its
#     OpenAI-compatible surface (the service speaks "Azure OpenAI" env names).
#     NOTE: LiteLLM -> Bedrock is currently broken at the account level (the
#     Anthropic use-case form) — ingestion will serve its API regardless, but
#     actual embedding calls stay degraded until that is resolved.
#   - replicaCount 1 (the reference deployment runs the API at 0 in sbx and lets the worker do the
#     work; we need the API up to answer /ingestion/graphql).
#   - ENABLE_MALWARE_SCAN false (no Defender here), ENABLE_CLIENT_INSIGHT_SHIPPER
#     false (no client-insight sink).

image:
  registry: harbor.openshift.example.com
  repository: uniquecr/backend-service-ingestion
  useDigest: false
  tag: "2026.34.4"

# Exposure is an OpenShift Route, not the chart's Kong HTTPRoutes. Disable every
# path so no gateway.networking.k8s.io object is rendered (the base chart
# hard-fails on missing Gateway API CRDs when any path is enabled).
routes:
  hostname: openshift.example.com
  pathPrefix: /ingestion
  paths:
    default:
      enabled: false
    probe:
      enabled: false
    scoped:
      enabled: false

replicaCount: 1

autoscaling:
  enabled: false

postgresql:
  enabled: true
  connection:
    host: hello-openshift-postgres-rw.hello-openshift-data.svc.cluster.local
    port: 5432
    database: ingestion
    username: app_user
    password:
      fromSecret:
        name: chat-db
        key: password
    sslMode: require

# Wired through explicit env/envVars below instead of the chart's connection
# blocks — same pattern as backend-service-chat.yaml.
rabbitmq:
  enabled: false
  connection: {}
qdrant:
  enabled: false
  connection: {}
elasticsearch:
  enabled: false
  connection: {}

prometheus:
  enabled: false

secretProvider: {}

serviceAccount:
  enabled: true

env:
  LOG_LEVEL: info
  MAX_HEAP_MB: "550"
  AUDIT_LOG_DIR: /dev/stdout
  UNIQUE_INSTALLATION_ID: openshift.example.com
  # MANDATORY for authorization, not just for login: the service's
  # AccessControlGuard reads the caller's roles from the token claim
  # `urn:zitadel:iam:org:project:${ZITADEL_PROJECT_ID}:roles`. Omit these and it
  # looks up a claim that does not exist in this cluster's tokens, sees every
  # caller as role-less and answers `{"errors":[{"message":"Forbidden
  # resource"...}]}` inside an HTTP 200 — which the chat UI renders as a bare 403
  # page. Same trap that hit four other backends (see git log for a950e0a).
  ZITADEL_HOST: https://id.openshift.example.com
  ZITADEL_PROJECT_ID: "<project-id>"
  ZITADEL_ROOT_ORG_ID: "<root-org-id>"
  FILE_RETENTION_IN_DAYS: "30"
  MAX_REQUEST_BODY_SIZE: "30mb"
  ENABLE_MALWARE_SCAN: "false"
  ENABLE_CLIENT_INSIGHT_SHIPPER: "false"
  ADDITIONAL_INGESTION_QUEUES: '["chat_queue"]'
  # Public upload endpoint (the frontend PUTs files here through the Route).
  INGESTION_UPLOAD_API_URL: https://openshift.example.com/ingestion/upload
  CHAT_URL: http://chat.unique.svc:8093
  CONFIGURATION_BACKEND_URL: http://configuration-backend.unique.svc:8095
  SCOPE_MANAGEMENT_URL: http://scope-management.unique.svc:8094
  USE_SCOPE_MANAGEMENT: "true"
  # Vector store: the conduct Qdrant release in ns finance-gpt.
  QDRANT_URL: http://qdrant-frosty-mud.finance-gpt.svc.cluster.local:6333
  QDRANT_READ_CONSISTENCY: "1"
  REPLICATION_FACTOR: "1"
  SCORE_THRESHOLD: "0"
  # Embeddings via LiteLLM's OpenAI-compatible surface. The deployment name must
  # match a litellm model_name (conduct/values/litellm.yaml).
  AZURE_OPENAI_API_ENDPOINT: http://litellm.system.svc:4000
  AZURE_OPENAI_API_DEPLOYMENT_NAME: cohere-embed-4-fp16
  AZURE_OPENAI_API_VERSION: "2023-05-15"
  EMBEDDING_DIMENSION: "1536"
  # No Elasticsearch on this cluster — keep both search flags off.
  FEATURE_FLAG_ENABLE_ELASTICSEARCH_INDEXING: "false"
  FEATURE_FLAG_ENABLE_SEARCH_ADAPTER_ELASTICSEARCH_UN_9883: "false"
  USE_NEW_FTS_QUERY_APPROACH: "true"
  # Chat uploads: parse PDFs with the built-in extractor. The chart default
  # DOC_INTELLIGENCE_DEFAULT needs Azure Document Intelligence, which does not
  # exist here; CUSTOM_SINGLE_PAGE_API needs per-scope customApiOptions that
  # chat scopes do not carry (the reference deployment hit exactly that and moved to PDFTODOCX_ONLY).
  PDF_READ_MODE: "PDFTODOCX_ONLY"
  # File storage -> the same in-cluster ODF NooBaa bucket node-chat writes to
  # (chat uploads the file, ingestion reads it back), see obc-chat-storage.yaml.
  STORAGE_PROVIDER: s3
  S3_BUCKET_ENDPOINT: https://s3.openshift-storage.svc:443
  S3_BUCKET_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  TRUSTED_DOMAINS: '["*.amazonaws.com","*.openshift-storage.svc"]'
  NODE_TLS_REJECT_UNAUTHORIZED: "0"  # NooBaa self-signed cert (sbx)

envVars:
  - name: AMQP_USERNAME
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: username
  - name: AMQP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: password
  - name: AMQP_HOST
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: host
  - name: AMQP_PORT
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: port
  - name: S3_BUCKET_BUCKET_NAME
    valueFrom:
      configMapKeyRef:
        name: chat-storage
        key: BUCKET_NAME
  - name: S3_BUCKET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: chat-storage
        key: AWS_ACCESS_KEY_ID
  - name: S3_BUCKET_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: chat-storage
        key: AWS_SECRET_ACCESS_KEY

# AZURE_OPENAI_API_KEY (= the LiteLLM PROXY_MASTER_KEY) — ESO <- ASM
# hello-openshift/sbx/ingestion-secrets, see external-secret-app-secrets.yaml.
extraEnvSecrets:
  - ingestion-secrets

# {} not null — the per-app chart schema rejects null.
nodeSelector: {}
