# Public path-based Route for the Unique knowledge-upload UI. Same edge model as
# route-chat.yaml / route-admin.yaml: TLS terminates at CloudFront/ALB and reaches
# the router as plain HTTP:80, so this is a non-TLS Route (a tls/redirect policy
# would loop).
#
# No rewrite-target here, unlike the backend Routes: the frontend serves itself
# under the /knowledge-upload prefix, so the path must be passed through intact.
#
# GOTCHA: targetPort must be the service's port NAME (`http`), never the number —
# a numeric value yields router 503s.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: knowledge-upload
  namespace: unique
  # Wave 5 (infra), same reasoning as route-chat.yaml: the Route must not sit
  # behind the user-owned-secret ExternalSecrets (wave 6) that stay Degraded
  # until their ASM secrets exist, or it would never apply.
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  host: openshift.example.com
  path: /knowledge-upload
  to:
    kind: Service
    name: knowledge-upload-app
  port:
    targetPort: http
