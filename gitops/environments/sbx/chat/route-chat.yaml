# Public path-based Route for the Unique chat UI. Same host/edge model as
# route-hubble-ui.yaml: TLS terminates at CloudFront/ALB and reaches the router
# as plain HTTP:80, so this is a non-TLS Route (a tls/redirect policy would
# loop). Path /chat -> the chat-app frontend service (:3000).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: chat
  namespace: unique
  # Wave 5 (infra), not 6 — the Route must not sit behind the user-owned-secret
  # ExternalSecrets (chat-secrets/assistants-core-secrets, wave 6) that stay
  # Degraded until their ASM secrets exist; otherwise the Route never applies.
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  host: openshift.example.com
  path: /chat
  to:
    kind: Service
    name: chat-app
  port:
    targetPort: http
