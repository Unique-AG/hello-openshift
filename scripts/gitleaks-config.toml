# Gitleaks Configuration for Hello OpenShift Repository
# This configuration defines rules for detecting secrets in the codebase

title = "Hello OpenShift Secret Detection"

[allowlist]
  description = "Allowlisted files and paths"
  # NOTE: scripts/ is deliberately NOT allowlisted. Excluding it would mean a
  # credential pasted into a deployment script is never scanned, which is the
  # single most likely way one enters this repository.
  files = [
    '''^.*\.example$''',                      # Example files
    '''^.*\.template$''',                     # Template files
    '''^\.gitignore$''',                      # Git ignore file
    '''gitleaks-config\.toml''',              # Gitleaks config file itself
    '''scripts/gitleaks-config\.toml''',      # Gitleaks config file itself
  ]
  regexes = [
    '''-----BEGIN [A-Z ]*PRIVATE KEY-----''',  # Private key patterns in config
    '''-----BEGIN CERTIFICATE-----''',         # Certificate patterns in config
    '''-----BEGIN PGP PRIVATE KEY BLOCK-----''', # PGP key patterns in config
  ]
  paths = [
    '''node_modules''',
    '''\.terraform''',
    '''\.git''',
    '''vendor''',
    '''dist''',
    '''build''',
    # docs/ is deliberately NOT excluded: runbooks are a common place for a
    # token to be pasted "temporarily".
    '''\.specs''',                            # Local specs directory (gitignored)
  ]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
  tags = ["aws", "key"]

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Key"
  regex = '''(?i)aws_secret_access_key[=:][\s"']*([A-Za-z0-9+/]{40})'''
  tags = ["aws", "secret"]

[[rules]]
  id = "aws-session-token"
  description = "AWS Session Token"
  regex = '''(?i)aws_session_token[=:][\s"']*([A-Za-z0-9+/]{260,400})'''
  tags = ["aws", "token"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''
  tags = ["key", "private"]

[[rules]]
  id = "certificate"
  description = "Certificate"
  regex = '''-----BEGIN CERTIFICATE-----'''
  tags = ["certificate"]

[[rules]]
  id = "ssh-private-key"
  description = "SSH Private Key"
  regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
  tags = ["ssh", "key", "private"]

[[rules]]
  id = "rsa-private-key"
  description = "RSA Private Key"
  regex = '''-----BEGIN RSA PRIVATE KEY-----'''
  tags = ["rsa", "key", "private"]

[[rules]]
  id = "pgp-private-key"
  description = "PGP Private Key"
  regex = '''-----BEGIN PGP PRIVATE KEY BLOCK-----'''
  tags = ["pgp", "key", "private"]

[[rules]]
  id = "github-token"
  description = "GitHub Personal Access Token"
  regex = '''ghp_[A-Za-z0-9]{36}'''
  tags = ["github", "token"]

[[rules]]
  id = "github-oauth"
  description = "GitHub OAuth Access Token"
  regex = '''gho_[A-Za-z0-9]{36}'''
  tags = ["github", "oauth"]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(api[_-]?key|apikey)[=:][\s"']*([A-Za-z0-9_-]{20,})'''
  tags = ["api", "key"]

[[rules]]
  id = "slack-token"
  description = "Slack Token"
  regex = '''xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,34}'''
  tags = ["slack", "token"]

[[rules]]
  id = "stripe-key"
  description = "Stripe API Key"
  regex = '''(?i)sk_live_[0-9a-zA-Z]{24}'''
  tags = ["stripe", "key", "secret"]

[[rules]]
  id = "database-password"
  description = "Database Password"
  regex = '''(?i)(database.*password|db.*password|redis.*password|postgres.*password)[=:][\s"']*([^;\s]{8,})'''
  tags = ["database", "password"]

[[rules]]
  id = "jwt-token"
  description = "JWT Token"
  regex = '''eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*'''
  tags = ["jwt", "token"]

[[rules]]
  id = "hardcoded-password"
  description = "Hardcoded Password"
  regex = '''(?i)password[=:][\s"']*(admin|root|password|123456|qwerty)'''
  tags = ["password", "hardcoded"]

[[rules]]
  id = "terraform-secret"
  description = "Terraform Secret Variable"
  regex = '''(?i)(secret|token|key|password|access_key|secret_key)[_]*[=:]\s*["']([^"'\s]{8,})["']'''
  tags = ["terraform", "secret"]

[[rules]]
  id = "kubernetes-secret"
  description = "Kubernetes Secret Value"
  regex = '''(?i)stringData:\s*\n\s*[a-zA-Z_-]+:\s*["']?([^"'\s\n]{16,})["']?'''
  tags = ["kubernetes", "secret"]

[[rules]]
  id = "openshift-token"
  description = "OpenShift Token"
  regex = '''sha256~[A-Za-z0-9_-]{43}'''
  tags = ["openshift", "token"]

[[rules]]
  id = "redhat-token"
  description = "Red Hat API Token"
  regex = '''(?i)rhsm[_-]?token[=:][\s"']*([A-Za-z0-9_-]{20,})'''
  tags = ["redhat", "token"]

[[rules]]
  id = "high-entropy-secret"
  description = "High Entropy Secret (very random strings)"
  regex = '''[A-Za-z0-9+/]{32,}'''
  entropy = 4.5
  tags = ["high-entropy", "secret"]

[[rules]]
  id = "docs-high-entropy-only"
  description = "Very High Entropy Only in Documentation"
  regex = '''[A-Za-z0-9+/]{40,}'''
  entropy = 5.0
  tags = ["documentation", "high-entropy", "secret"]
  paths = [
    '''\.md$''',     # Apply to all .md files
    '''\.txt$''',    # Apply to all .txt files
  ]
